name: Prepare pull request for review

on:
  workflow_run:
    workflows: [CI, CLA, PR assignment guard]
    types: [completed]
  pull_request_target:
    types: [reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Existing pull request to check for maintainer review
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Identify review request
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull-number: ${{ steps.request.outputs.pull-number }}
      explicit-request: ${{ steps.request.outputs.explicit-request }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve the pull request and authorize comment commands
        id: request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { resolve } = require('./.github/scripts/request-maintainer-review.cjs');
            await resolve({ github, context, core });

  prepare:
    name: Approve checks and request maintainer review
    needs: resolve
    if: needs.resolve.outputs.pull-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      statuses: read
      issues: write
      pull-requests: write
    concurrency:
      group: prepare-review-${{ needs.resolve.outputs.pull-number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify checks, approve, and request review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PULL_NUMBER: ${{ needs.resolve.outputs.pull-number }}
          EXPLICIT_REQUEST: ${{ needs.resolve.outputs.explicit-request }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/request-maintainer-review.cjs');
            await prepare({
              github, context, core,
              pullNumber: Number(process.env.PULL_NUMBER),
              explicit: process.env.EXPLICIT_REQUEST === 'true',
            });
